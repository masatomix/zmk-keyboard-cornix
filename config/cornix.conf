# macOS BLE stability settings

# Disable 2Mbps PHY (macOS Broadcom chipsets may have issues with 2M PHY)
CONFIG_BT_CTLR_PHY_2M=n

# Increase BLE connection interval for stability
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Increase BLE TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
